work_experience:
  - title: Procurement Buyer
    company: Decibel Cannabis Company
    dates: Dec 2025 - Present
    achievements:
      - Identified fragmented supplier and category-spend visibility across procurement operations and developed SQL-based analytics and Power BI dashboards to consolidate purchasing, supplier, and inventory data, reducing manual reporting time by 50% and strengthening data-driven sourcing decisions.
      - Optimized purchasing strategies by analyzing production requirements, supplier lead times, demand forecasts, and inventory positions, reducing excess inventory by 20% while supporting 98% production uptime.
      - Strengthened supplier performance and commercial accountability through proactive vendor engagement, delivery monitoring, and supplier relationship management, improving on-time deliveries by 30% and achieving a 98% overall delivery rate.
      - Led cross-functional procurement improvement initiatives by standardizing Procure-to-Pay workflows, supplier master data governance, and performance reporting, maintaining 99%+ Sage ERP data accuracy and improving procurement visibility and operational compliance.

  - title: Procurement Engineer
    company: Vestas Wind Technology
    dates: Jan 2021 - Aug 2023
    achievements:
      - Developed and executed strategic sourcing initiatives for technical and engineered components, including electrical controls, converters, switches, cables, and equipment, leveraging global supplier networks, market intelligence, and cost benchmarking to achieve procurement cost reductions of 15%.
      - Led end-to-end strategic sourcing and RFx activities, including supplier identification, quotation analysis, commercial evaluation, negotiations, and supplier selection; implemented automated bid-comparison solutions that reduced purchasing cycle time by 40% and supported competitive sourcing decisions.
      - Identified category-level cost optimization and working-capital opportunities through supplier cost analysis, payment-term negotiations, and commercial benchmarking, identifying €3M in potential savings through standardized procurement strategies and improved credit-period management.
      - Partnered with engineering, project management, finance, and supply chain stakeholders to align sourcing strategies, technical specifications, procurement budgets, and delivery schedules; strengthened supplier performance governance through KPI scorecards, Power BI reporting, and process automation, improving procurement efficiency by 15%.

  - title: Procurement Analyst
    company: Valeo India
    dates: Jun 2019 - Jan 2021
    achievements:
      - Managed strategic sourcing and competitive RFx activities across manufacturing supply categories, coordinating supplier identification, commercial evaluations, e-auctions, and negotiations to achieve 10–15% procurement cost reductions.
      - Conducted detailed spend analysis, supplier benchmarking, and zero-based costing using advanced Excel, macros, and analytical tools to identify cost drivers, challenge supplier pricing, and deliver procurement savings of up to 15%.
      - Mitigated supplier concentration and supply continuity risks by onboarding alternative suppliers, implementing dual-sourcing strategies, and supporting localization initiatives, improving supply chain efficiency by 20%.
      - Strengthened category and supplier performance visibility through procurement KPI dashboards, market intelligence, third-party risk assessments, and digital sourcing platforms, reducing reporting time by 40% and supporting informed supplier-selection and sourcing decisions.

  - title: Junior Engineer
    company: Precirec Engineers
    dates: Mar 2017 - Jun 2019
    achievements:
      - Led industrial equipment development initiatives, including Automatic Induction Hardening and Wet End equipment, coordinating feasibility assessments, cost analysis, technical specifications, design validation, and production implementation across engineering, customers, and vendors.
      - Coordinated engineering, production, and supplier requirements to resolve technical and manufacturing challenges, implement corrective actions, and maintain alignment with operational priorities, quality requirements, and project schedules.
      - Supported CapEx-related equipment and machinery requirements through vendor coordination, equipment evaluation, maintenance, retrofitting, and technical documentation, improving equipment reliability and operational continuity.

