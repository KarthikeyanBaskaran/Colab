summary: Strategic Procurement and Sourcing professional with 7+ years of experience
  supporting sourcing, supplier management, RFQs, pricing analysis, commercial negotiations,
  spend analysis, inventory planning, and supply continuity across global manufacturing
  environments. Experienced in identifying and evaluating suppliers, preparing quotation
  comparisons, analyzing pricing and cost drivers, supporting negotiations, monitoring
  supplier performance, and coordinating logistics and delivery requirements. Advanced
  proficiency in Microsoft Excel, Power BI, SQL, SAP, and ERP systems for spend analysis,
  supplier reporting, pricing analysis, forecasting, and procurement decision support.
  Strong cross-functional partner to Procurement, Operations, Finance, Engineering,
  Supply Chain, Logistics, and suppliers, with a proven record of process improvement,
  cost optimization, and supplier risk mitigation.
