summary: Procurement & Supplier Engineering Professional with 7+ years of experience in NPI, technical sourcing, and capital equipment procurement across advanced manufacturing environments. Strong expertise in RFQ-to-PO execution, supplier qualification (APQP/PPAP), and engineering change management (ECO), ensuring seamless translation of design intent into production readiness. Experienced in DFM, drawing interpretation, and should-cost modeling to optimize supplier selection and cost performance. Proven ability to collaborate with Engineering and Manufacturing teams to support prototyping, tooling, and product launches. Skilled in SAP, SQL, Power BI, and automation tools to drive data-backed procurement and supplier performance visibility.

