summary: Strategic Procurement and Supply Chain Analyst with 8+ years of experience
  leading sourcing, supplier management, procurement operations, and cost optimization
  initiatives across global manufacturing and industrial environments. Proven expertise
  in strategic sourcing, vendor negotiations, procurement analytics, ERP systems,
  and supplier performance management using Power BI, SQL, and Excel. Experienced
  managing end-to-end purchasing operations including purchase orders, shipment tracking,
  lead-time monitoring, contract management, and supplier risk mitigation. Adept at
  collaborating cross-functionally with operations, engineering, finance, and sales
  teams to improve supply continuity, operational efficiency, and procurement performance.
