    supporting 98% production uptime.
  - Improved supplier delivery performance through proactive vendor follow-up, lead-time
    monitoring, and resolution of delivery issues, achieving a 30% improvement in
    on-time delivery.
  - Established SQL-based supplier performance tracking and Power BI procurement dashboards
    to improve visibility into supplier performance, purchasing activity, and spend,
    reducing manual reporting time by 50% and supporting data-driven procurement decisions.
