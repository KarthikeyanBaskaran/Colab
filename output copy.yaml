summary: Strategic Procurement and Category Management professional with 7+ years
  of experience across manufacturing and industrial environments, specializing in
  strategic sourcing, commodity procurement, category spend analysis, supplier negotiations,
  cost optimization, and material replenishment. Experienced in developing sourcing
  strategies, managing RFx activities, evaluating supplier pricing and cost drivers,
  conducting supplier benchmarking, and mitigating supply continuity risks across
  global supplier networks. Strong background in manufacturing procurement, engineered
  components, inventory planning, MIN/MAX optimization, supplier performance management,
  and cross-functional collaboration with Engineering, Finance, Production, Quality,
  and Supply Chain. Advanced proficiency in Microsoft Excel, Power BI, SAP, SQL, and
  ERP systems to deliver actionable spend insights, improve procurement visibility,
  and support fact-based commercial decisions.
